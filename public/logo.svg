<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Outer rim gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b80008"/>
      <stop offset="50%" stop-color="#8a0004"/>
      <stop offset="100%" stop-color="#540000"/>
    </linearGradient>

    <!-- Main button body gradient -->
    <radialGradient id="bodyGrad" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ff1a2b"/>
      <stop offset="45%" stop-color="#e60012"/>
      <stop offset="85%" stop-color="#b50009"/>
      <stop offset="100%" stop-color="#800000"/>
    </radialGradient>

    <!-- Triangle crimson gradient -->
    <linearGradient id="triGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#b3000a"/>
      <stop offset="100%" stop-color="#850005"/>
    </linearGradient>

    <!-- Subtle drop shadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#550000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer ring / rim -->
  <circle cx="256" cy="256" r="246" fill="url(#rimGrad)" stroke="#4a0000" stroke-width="4"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#ff3848" stroke-width="2" opacity="0.4"/>

  <!-- Inner circular face -->
  <circle cx="256" cy="256" r="222" fill="url(#bodyGrad)" filter="url(#badgeShadow)"/>

  <!-- Inner groove ring -->
  <circle cx="256" cy="256" r="221" fill="none" stroke="#680004" stroke-width="6"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="#ff2636" stroke-width="2" opacity="0.6"/>

  <!-- Glossy curved reflection on lower / side section -->
  <path d="M 46 230 C 55 350, 160 450, 290 468 C 410 460, 470 360, 474 235 C 430 330, 310 390, 210 370 C 130 354, 70 290, 46 230 Z" fill="#750005" opacity="0.35"/>

  <!-- Center White Rounded Rectangle Badge (YouTube/Play style) -->
  <rect x="106" y="156" width="300" height="200" rx="60" ry="60" fill="#ffffff" filter="url(#badgeShadow)"/>

  <!-- Center Dark Red Play Triangle pointing right -->
  <polygon points="216,198 336,256 216,314" fill="url(#triGrad)" filter="url(#softShadow)"/>
</svg>
