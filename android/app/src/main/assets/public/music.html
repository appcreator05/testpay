<script>
// ==========================================
// VIP SUBSCRIPTION CHECK & SUPPRESSION
// ==========================================
function isUserVipSubscribed() {
    try {
        const isSub = localStorage.getItem('vdosky_sub_active') === '1';
        const expStr = localStorage.getItem('vdosky_sub_expires_at');
        if (isSub && expStr) {
            const exp = new Date(expStr);
            if (new Date() < exp) {
                return true;
            } else {
                localStorage.removeItem('vdosky_sub_active');
                localStorage.removeItem('vdosky_sub_expires_at');
                return false;
            }
        }
        return false;
    } catch (e) {
        return false;
    }
}

function applyVipUiIfSubscribed() {
    if (isUserVipSubscribed()) {
        document.body.classList.add('vip-mode');
        const top = document.getElementById('musicTopAd');
        if (top) {
            top.style.display = 'none';
            top.innerHTML = '';
        }
        const footer = document.getElementById('musicFixedFooterAd');
        if (footer) {
            footer.style.display = 'none';
            footer.innerHTML = '';
        }
        const modal = document.getElementById('smartlinkInterstitialModal');
        if (modal) modal.style.display = 'none';

        const miniPlayer = document.getElementById('miniPlayer');
        if (miniPlayer) {
            miniPlayer.style.bottom = '0px';
        }
        const musicList = document.getElementById('musicList');
        if (musicList) {
            musicList.style.marginTop = '76px';
            musicList.style.marginBottom = '120px';
            musicList.classList.add('vip-spacing');
        }
    } else {
        document.body.classList.remove('vip-mode');
        const musicList = document.getElementById('musicList');
        if (musicList) {
            musicList.style.marginTop = '10px';
            musicList.classList.remove('vip-spacing');
        }
    }
}

// ==========================================
// ADVERTISING ENGINES (Start.io)
// ==========================================
function triggerStartIoInterstitial() {
    if (isUserVipSubscribed()) return;
    if (window.Android && typeof window.Android.showInterstitialAd === 'function') {
        window.Android.showInterstitialAd();
    } else if (window.Android && typeof window.Android.showInterstitial === 'function') {
        window.Android.showInterstitial();
    }
}
function triggerFacebookInterstitial() {
    triggerStartIoInterstitial();
}

function triggerSmartlinkInterstitial() {
    triggerStartIoInterstitial();
}

window.closeSmartlinkInterstitial = function() {
    const modal = document.getElementById('smartlinkInterstitialModal');
    if (modal) modal.style.display = 'none';
};

window.openVipFromMusicAd = function() {
    sessionStorage.setItem('vdosky_open_vip', '1');
    window.location.href = 'index.html';
};

// 10-Minute Rewarded Ad Timer
setInterval(() => {
    if (isUserVipSubscribed()) return;
    if (window.Android && typeof window.Android.showRewardedVideoAd === 'function') {
        window.Android.showRewardedVideoAd();
    }
}, 10 * 60 * 1000);

// 300x250 Medium Rectangle Native Banner Ad Units (Start.io App ID: 203877183)
let musicMrecSyncInterval = null;
let musicMrecSlotCounter = 0;

function syncMusicNativeMrecAdView() {
    if (!window.Android) return;
    if (isUserVipSubscribed()) {
        if (typeof window.Android.hideAllMrecAds === 'function') window.Android.hideAllMrecAds();
        else if (typeof window.Android.hideMrecAd === 'function') window.Android.hideMrecAd();
        return;
    }

    const surfaces = document.querySelectorAll('.mrec-native-surface');
    if (surfaces.length === 0) {
        if (typeof window.Android.hideAllMrecAds === 'function') window.Android.hideAllMrecAds();
        else if (typeof window.Android.hideMrecAd === 'function') window.Android.hideMrecAd();
        return;
    }

    const dpr = window.devicePixelRatio || 1;
    const viewHeight = window.innerHeight;

    let hasVisibleSurface = false;
    surfaces.forEach(surface => {
        const slotId = surface.getAttribute('data-slot-id') || surface.id;
        if (!slotId) return;

        const rect = surface.getBoundingClientRect();
        const isVisible = rect.bottom > 0 && rect.top < viewHeight && rect.width > 0 && rect.height > 0 && window.getComputedStyle(surface).display !== 'none';

        if (isVisible) hasVisibleSurface = true;

        if (typeof window.Android.updateMrecSlotPosition === 'function') {
            window.Android.updateMrecSlotPosition(
                slotId,
                Math.round(rect.left * dpr),
                Math.round(rect.top * dpr),
                Math.round(rect.width * dpr),
                Math.round(rect.height * dpr),
                isVisible
            );
        } else if (isVisible && typeof window.Android.showMrecAd === 'function') {
            window.Android.showMrecAd(
                Math.round(rect.left * dpr),
                Math.round(rect.top * dpr),
                Math.round(rect.width * dpr),
                Math.round(rect.height * dpr)
            );
        }
    });

    if (!hasVisibleSurface && typeof window.Android.hideMrecAd === 'function') {
        window.Android.hideMrecAd();
    }
}

window.addEventListener('scroll', syncMusicNativeMrecAdView, { passive: true });
window.addEventListener('resize', syncMusicNativeMrecAdView, { passive: true });

window.onFacebookMrecSlotLoadedState = function(slotId, isLoaded) {
    const indicator = document.querySelector(`.mrec-status-indicator[data-slot-id="${slotId}"]`);
    if (indicator) {
        if (isLoaded) {
            indicator.style.display = 'none';
        } else {
            indicator.innerHTML = `<span style="color: #64748b; font-size: 10px;">Ad loading...</span>`;
        }
    }
    if (isLoaded) {
        syncMusicNativeMrecAdView();
    }
};

function renderAd300x250Iframe(container) {
    if (isUserVipSubscribed() || !container) return;
    if (container.getAttribute('data-loaded') === 'true') return;
    container.setAttribute('data-loaded', 'true');

    const slotId = container.id || ('music_mrec_' + (++musicMrecSlotCounter));
    container.setAttribute('data-slot-id', slotId);

}

let topAdRefreshTimer = null;
let footerAdRefreshTimer = null;

function initMusicAds() {
    if (isUserVipSubscribed()) {
        applyVipUiIfSubscribed();
        return;
    }

    // 1. Top Banner 320x50
    const topInner = document.getElementById('musicTopAdInner');
    if (topInner) {
        renderBanner320x50(topInner);
        if (topAdRefreshTimer) clearInterval(topAdRefreshTimer);
        topAdRefreshTimer = setInterval(() => {
            if (!isUserVipSubscribed()) {
                renderBanner320x50(topInner);
            } else {
                applyVipUiIfSubscribed();
            }
        }, 50000);
    }

    // 2. Fixed Footer Banner 320x50
    const footerInner = document.getElementById('musicFixedFooterAdInner');
    if (footerInner) {
        renderBanner320x50(footerInner);
        if (footerAdRefreshTimer) clearInterval(footerAdRefreshTimer);
        footerAdRefreshTimer = setInterval(() => {
            if (!isUserVipSubscribed()) {
                renderBanner320x50(footerInner);
            } else {
                applyVipUiIfSubscribed();
            }
        }, 48000);
    }
}

// ==========================================
// MUSIC PLAYER ENGINE
// ==========================================
let songsList = [], currentQueue = [], currentPlaylist = [], currentSongIndex = 0;
const audio = document.getElementById('audioPlayer');
const range = document.getElementById('audioRange');
const curTimeSpan = document.getElementById('currentTime');
const durTimeSpan = document.getElementById('durationTime');
const playPauseImg = document.getElementById('playPauseImg');

const ICON_PLAY = "play.png";
const ICON_PAUSE = "pause.png";
const FALLBACK_PLAY = "https://raw.githubusercontent.com/shortsproeran-creator/mt/main/1784458824699_play.png";
const FALLBACK_PAUSE = "https://raw.githubusercontent.com/shortsproeran-creator/mt/main/1784459617609_pouse.png";

function setPlayPauseIcon(isPlaying) {
    if (!playPauseImg) return;
    if (isPlaying) {
        playPauseImg.src = ICON_PAUSE;
        playPauseImg.onerror = function() {
            this.src = "pouse.png";
            this.onerror = function() { this.src = FALLBACK_PAUSE; };
        };
    } else {
        playPauseImg.src = ICON_PLAY;
        playPauseImg.onerror = function() {
            this.src = FALLBACK_PLAY;
        };
    }
}

function shuffleArray(array) { return [...array].sort(() => Math.random() - 0.5); }
function formatTime(s) { 
    if (isNaN(s) || s < 0) return "0:00";
    let m = Math.floor(s / 60), sec = Math.floor(s % 60); 
    return m + ":" + (sec < 10 ? "0" + sec : sec); 
}

async function loadMusic() {
    try {
        const res = await fetch("https://raw.githubusercontent.com/appcreator05/post/main/6766846.json");
        songsList = await res.json();
        currentQueue = [];
        songsList.forEach(m => {
            if (Array.isArray(m.songs)) {
                m.songs.forEach(s => currentQueue.push({ ...s, poster: m.poster, movie: m.movie, category: m.category }));
            }
        });
        currentPlaylist = shuffleArray(currentQueue);
        
        renderMusicList(currentPlaylist.slice(0, 100));
        loadCategories();
        initMusicAds();

        setTimeout(() => {
            if (currentPlaylist.length > 0) {
                playMusic(0, true); 
            }
        }, 800);
    } catch (err) {
        console.error("Failed to load songs:", err);
        const list = document.getElementById('musicList');
        if (list) {
            list.innerHTML = `<div style="text-align:center; padding:40px; color:#ff3b30;">Failed to load music playlist. Please check internet connection.</div>`;
        }
    }
}

function renderMusicList(songs) {
    const list = document.getElementById('musicList');
    if (!list) return;
    const fragment = document.createDocumentFragment();
    list.innerHTML = "";

    const displayLimit = songs.slice(0, 200); 

    displayLimit.forEach((song, i) => {
        const isPlaying = (song.id === (currentPlaylist[currentSongIndex] ? currentPlaylist[currentSongIndex].id : null));
        const div = document.createElement('div');
        div.className = 'song-item' + (isPlaying ? ' active' : '');
        
        div.innerHTML = `<img src="${song.poster || ''}" referrerpolicy="no-referrer" loading="lazy" class="song-img" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100&auto=format&fit=crop&q=60';" onclick="openModal('${song.poster}', event)">
                         <div class="song-text-container" onclick="playMusic(${i})">
                             <strong>${song.title}</strong>
                             <small>${song.movie || ''}</small>
                         </div>`;
        fragment.appendChild(div);

        // Insert native 300x250 ad unit after every 10 songs (ONLY for non-VIP users)
        if (!isUserVipSubscribed() && (i + 1) % 10 === 0 && i < displayLimit.length - 1) {
            const adWrapper = document.createElement('div');
            adWrapper.className = 'ad-slot-300x250';
            adWrapper.innerHTML = `
                <span class="ad-label">Advertisement</span>
                <div class="ad-slot-300x250-inner"></div>
            `;
            const adInner = adWrapper.querySelector('.ad-slot-300x250-inner');
            fragment.appendChild(adWrapper);
            renderAd300x250Iframe(adInner);
        }
    });

    list.appendChild(fragment);
}

function openModal(imgSrc, event) { 
    if (event) event.stopPropagation(); 
    document.getElementById('modalImg').src = imgSrc; 
    document.getElementById('imageModal').style.display = 'flex'; 
    const miniPlayer = document.getElementById('miniPlayer');
    if (miniPlayer && currentPlaylist && currentPlaylist.length > 0) {
        miniPlayer.style.display = 'flex';
    }
}

function closeModal() { 
    document.getElementById('imageModal').style.display = 'none'; 
}

function playMusic(index, isInitial = false) {
    if (!currentPlaylist || index >= currentPlaylist.length) return;
    const song = currentPlaylist[index]; 
    currentSongIndex = index;

    audio.src = `https://www.googleapis.com/drive/v3/files/${song.id}?alt=media&key=AIzaSyAwS9f57z785lDD9aKedEEJVol_-P518v0`;
    document.getElementById('nowPlaying').innerText = song.title + (song.movie ? ` • ${song.movie}` : '');
    
    const miniPlayer = document.getElementById('miniPlayer');
    if (miniPlayer) miniPlayer.style.display = 'flex';
    
    if (document.getElementById('imageModal').style.display === 'flex') {
        document.getElementById('modalImg').src = song.poster;
    }
    
    const playPromise = audio.play(); 
    if (playPromise !== undefined) {
        playPromise.then(() => {
            setPlayPauseIcon(true);
        }).catch(err => {
            setPlayPauseIcon(false);
        });
    }

    renderMusicList(currentPlaylist);
    
    setTimeout(() => {
        const activeElement = document.querySelector('.song-item.active');
        if (activeElement) activeElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 120);

    // Occasional interstitial ad trigger on user interaction (ONLY for non-VIP users)
    if (!isInitial && !isUserVipSubscribed() && Math.random() < 0.25) {
        triggerSmartlinkInterstitial();
    }
}

function nextSong() { 
    if (currentPlaylist.length === 0) return;
    currentSongIndex = (currentSongIndex + 1) % currentPlaylist.length; 
    playMusic(currentSongIndex); 
}

function prevSong() { 
    if (currentPlaylist.length === 0) return;
    currentSongIndex = (currentSongIndex - 1 + currentPlaylist.length) % currentPlaylist.length; 
    playMusic(currentSongIndex); 
}

function togglePlay() {
    if (audio.paused) {
        audio.play().then(() => {
            setPlayPauseIcon(true); 
        }).catch(() => {});
    } else {
        audio.pause();
        setPlayPauseIcon(false);
    }
}

audio.addEventListener('timeupdate', () => {
    if (!isNaN(audio.duration) && audio.duration > 0) {
        range.value = (audio.currentTime / audio.duration) * 100;
        curTimeSpan.innerText = formatTime(audio.currentTime);
        durTimeSpan.innerText = formatTime(audio.duration);
    }
});

audio.addEventListener('loadedmetadata', () => {
    durTimeSpan.innerText = formatTime(audio.duration);
});

range.addEventListener('input', () => {
    if (!isNaN(audio.duration)) {
        audio.currentTime = (range.value / 100) * audio.duration;
    }
});

audio.addEventListener('ended', nextSong);

function toggleSidebar() { 
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("sidebarOverlay");
    if (sidebar.style.width === "270px") {
        sidebar.style.width = "0";
        if (overlay) overlay.style.display = "none";
    } else {
        sidebar.style.width = "270px";
        if (overlay) overlay.style.display = "block";
    }
}

function loadCategories() { 
    const sidebar = document.getElementById("sidebar"); 
    [...new Set(songsList.map(item => item.category))].filter(Boolean).forEach(cat => { 
        const a = document.createElement("a"); 
        a.href = "javascript:void(0)"; 
        a.innerHTML = `<i class="fa-solid fa-compact-disc" style="margin-right: 8px; color: #ff3b30;"></i> ${cat}`; 
        
        a.onclick = (e) => { 
            e.preventDefault(); 
            e.stopPropagation(); 
            filterByCategory(cat);
            toggleSidebar();
        }; 
        sidebar.appendChild(a); 
    }); 
}

function filterByCategory(cat) { 
    audio.pause(); 
    audio.currentTime = 0;
    setPlayPauseIcon(false);
    document.getElementById('nowPlaying').innerText = "Select a song (" + cat + ")";
    
    const filteredSongs = shuffleArray(currentQueue.filter(s => s.category === cat));
    currentPlaylist = filteredSongs;
    currentSongIndex = 0; 
    
    renderMusicList(currentPlaylist); 
}

let searchTimeout;
function filterMusicList() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        let val = document.getElementById('musicSearch').value.toLowerCase().trim();
        if (!val) {
            currentPlaylist = currentQueue;
        } else {
            let filtered = currentQueue.filter(s => 
                (s.title && s.title.toLowerCase().includes(val)) || 
                (s.movie && s.movie.toLowerCase().includes(val)) ||
                (s.category && s.category.toLowerCase().includes(val))
            );
            currentPlaylist = filtered; 
        }
        renderMusicList(currentPlaylist); 
    }, 300);
}

function stopMusic() {
    audio.pause(); 
    audio.currentTime = 0;
    setPlayPauseIcon(false);
    document.getElementById('miniPlayer').style.display = 'none';
}
  
function showAllSongs() { 
    currentPlaylist = shuffleArray(currentQueue); 
    renderMusicList(currentPlaylist); 
    toggleSidebar(); 
}

applyVipUiIfSubscribed();
window.addEventListener('DOMContentLoaded', applyVipUiIfSubscribed);
loadMusic();
</script>
