<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Outer Blue Sphere Gradient -->
    <radialGradient id="sphereGrad" cx="45%" cy="38%" r="55%" fx="42%" fy="32%">
      <stop offset="0%" stop-color="#195eb3" />
      <stop offset="35%" stop-color="#0b3e85" />
      <stop offset="70%" stop-color="#052458" />
      <stop offset="100%" stop-color="#010f27" />
    </radialGradient>

    <!-- Top Gloss Highlight -->
    <linearGradient id="glossGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Bottom Rim Glow -->
    <linearGradient id="bottomRim" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#2a75d3" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#2a75d3" stop-opacity="0" />
    </linearGradient>

    <!-- 3D Green Arrow Gradient -->
    <linearGradient id="greenArrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7fe800" />
      <stop offset="45%" stop-color="#55c800" />
      <stop offset="85%" stop-color="#2a9600" />
      <stop offset="100%" stop-color="#1a6e00" />
    </linearGradient>

    <!-- Shadow filter for arrows -->
    <filter id="arrowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#001a05" flood-opacity="0.7" />
    </filter>

    <!-- Inner Sphere Shadow -->
    <radialGradient id="rimShine" cx="50%" cy="50%" r="50%">
      <stop offset="90%" stop-color="#000000" stop-opacity="0" />
      <stop offset="98%" stop-color="#001838" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#000d20" stop-opacity="1" />
    </radialGradient>
  </defs>

  <!-- Outer Drop Shadow on Button -->
  <circle cx="60" cy="62" r="54" fill="#000000" opacity="0.4" />

  <!-- Base Sphere -->
  <circle cx="60" cy="60" r="54" fill="url(#sphereGrad)" stroke="#021430" stroke-width="2.5" />
  <circle cx="60" cy="60" r="54" fill="url(#rimShine)" />

  <!-- Bottom Rim Glow -->
  <ellipse cx="60" cy="98" rx="36" ry="12" fill="url(#bottomRim)" />

  <!-- Top Glass Highlight (Gloss) -->
  <path d="M 18,52 C 22,25 38,12 60,12 C 82,12 98,25 102,52 C 85,58 72,60 60,60 C 48,60 35,58 18,52 Z" fill="url(#glossGrad)" />

  <!-- Rewind Arrows (Double Green Triangles pointing Left) -->
  <g filter="url(#arrowShadow)">
    <!-- First Arrow Left -->
    <path d="M 23,60 C 21.5,59 21.5,57 23,56 L 50,38 C 52,36.5 54,37.5 54,40 L 54,80 C 54,82.5 52,83.5 50,82 Z" fill="url(#greenArrowGrad)" stroke="#6fe000" stroke-width="1.2" stroke-linejoin="round" />
    
    <!-- Second Arrow Left -->
    <path d="M 52,60 C 50.5,59 50.5,57 52,56 L 79,38 C 81,36.5 83,37.5 83,40 L 83,80 C 83,82.5 81,83.5 79,82 Z" fill="url(#greenArrowGrad)" stroke="#6fe000" stroke-width="1.2" stroke-linejoin="round" />
  </g>
</svg>
