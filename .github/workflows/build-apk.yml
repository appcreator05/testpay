name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build VDOSKy Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Configure & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Setup Release Keystore
        run: |
          mkdir -p android/app
          if [ ! -f "android/app/release.keystore" ]; then
            echo "Restoring official AppInventor release keystore..."
            echo "" | base64 -d > android/app/release.keystore
          fi

      - name: Build Android Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: "android"
          KEY_ALIAS: "androidkey"
          KEY_PASSWORD: "android"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VDOSKy-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Prepare Release APK
        run: |
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*release*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            echo "Found Release APK: $RELEASE_APK"
            cp "$RELEASE_APK" VDOSKy.apk
          else
            echo "Error: Release APK not found"
            find android/app/build/outputs -type f || true
            exit 1
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: VDOSKy App Official Release v1.0.${{ github.run_number }}
          body: "Official Release APK for VDOSKy Android App with Voice Search, Fullscreen Landscape, Screen Wake Lock, and 3000+ Movies Streaming."
          files: VDOSKy.apk
